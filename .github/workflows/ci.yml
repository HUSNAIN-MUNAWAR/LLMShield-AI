name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend/app backend/tests
      - name: Run backend tests
        run: cd backend && pytest -q
      - name: Secret scan
        run: python scripts/secret_scan.py
      - name: Validate repository
        run: python scripts/validate_project.py
      - name: Mock provider smoke test
        run: python scripts/provider_smoke_test.py --provider mock

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci
      - name: Typecheck
        run: cd frontend && npm run typecheck
      - name: Build
        run: cd frontend && npm run build
